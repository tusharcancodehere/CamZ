<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CAMZ</title>
    <link rel="stylesheet" href="/static/style.css">
    <script defer src="/static/script.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">FastAPI camera monitor</p>
          <h1>CAMZ</h1>
          <p class="lede">Live stream, motion detection, snapshots, and recording in one lightweight interface.</p>
          <div class="actions">
            <a class="button primary" href="/stream.mjpeg" target="_blank" rel="noreferrer">Open stream</a>
            <a class="button secondary" href="/snapshot" target="_blank" rel="noreferrer">Take snapshot</a>
          </div>
        </div>
        <div class="status-card">
          <div class="status-dot" id="camera-status"></div>
          <div>
            <p class="status-label">Camera status</p>
            <p class="status-value" id="status-value">Ready</p>
          </div>
        </div>
      </section>

      <section class="viewer">
        <img src="/stream.mjpeg" alt="Live camera stream" onerror="this.replaceWith(document.createTextNode('Camera stream unavailable'));">
      </section>
    </main>
  </body>
</html>
