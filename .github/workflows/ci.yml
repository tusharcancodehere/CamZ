name: CAMZ Continuous Integration

on:
  push:
    branches: [ main, master, Cloudflare_support ]
  pull_request:
    branches: [ main, master, Cloudflare_support ]

jobs:
  backend-test:
    name: Python Lint, Type Check & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Run Ruff Code Quality Lint
        run: |
          ruff check .

      - name: Run Mypy Static Type Checking
        run: |
          mypy backend/ --python-version 3.12 --ignore-missing-imports

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -vv

  frontend-build:
    name: React Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Assets
        run: |
          cd frontend
          npm run build
